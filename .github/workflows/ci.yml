name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    # Donguri is Windows-only for now (the macOS code is placeholder stubs),
    # so only Windows is checked.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: cargo clippy --all-targets -- -D warnings
        working-directory: src-tauri
