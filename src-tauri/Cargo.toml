[package]
name = "donguri"
version = "0.1.2"
description = "Una ardilla pixel-art que guarda tu contexto para cualquier IA"
authors = ["juanccstro"]
license-file = "../LICENSE"
repository = "https://github.com/juanccstro/donguri"
edition = "2024"
default-run = "donguri"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "donguri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-global-shortcut = "2.4.1"
chrono = "0.4.45"
tauri-plugin-single-instance = "2.5.5"
rusqlite = { version = "0.43.0", features = ["bundled"] }
enigo = "0.6.1"
arboard = "3.7.0"
xcap = "0.9.10"
pdf-extract = "0.12.1"
futures-util = "0.3.34"
base64 = "0.23.1"
urlencoding = "2.1.3"
schemars = "1.2.3"
tauri-plugin-opener = "2.7.3"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "stream", "rustls", "http2"] }
keyring = { version = "3", features = ["windows-native", "apple-native"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "io-std", "sync", "time"] }
image = { version = "0.25.10", default-features = false, features = ["png"] }
rmcp = { version = "3.11.0", features = ["server", "transport-io", "macros", "schemars"] }
tauri-plugin-autostart = "2.7.0"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[target."cfg(windows)".dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_UI_Accessibility", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_System_Threading", "Win32_UI_Shell", "Win32_System_Com", "Win32_System_Variant", "Win32_System_Ole", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_LibraryLoader", "Win32_System_SystemInformation", "Win32_System_DataExchange", "Win32_System_Memory"] }
